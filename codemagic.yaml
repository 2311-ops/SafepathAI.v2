# Codemagic CI configuration for SafePath AI mobile (Flutter).
#
# Builds from `mobile/`, not the repository root. Codemagic discovers this
# file at the repository root by default, but the Flutter project lives one
# level down, so every workflow below sets its working_directory to that
# folder and all script paths are relative to mobile/.
#
# Every credential this file needs (signing certificate/profile, App Store
# Connect API key, Firebase config payloads) is supplied through a Codemagic
# environment-variable group or the App Store Connect integration named
# below -- never committed to this file or to the repository. See
# docs/EXTERNAL-SETUP.md for exactly what to create in the Codemagic UI so
# every group/integration/variable name referenced here resolves to a real
# value.

workflows:
  ios-testflight:
    name: iOS TestFlight build
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile

    # No `triggering` block, deliberately. Both workflows in this file are
    # manual-start only: the Codemagic free tier grants 500 build
    # minutes/month on macOS M2 runners, and an automatic push trigger on a
    # repository where most commits touch backend or planning files (not
    # mobile) would burn that budget on builds nobody asked for. A
    # `triggering` block with `events` and `branch_patterns` can be added
    # later once the pipeline is proven.

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.safepath.mobile
      groups:
        # Same two group names are used by the android-apk workflow below
        # and are documented verbatim in docs/EXTERNAL-SETUP.md so the
        # Codemagic UI setup and this file cannot drift apart.
        - safepath_mobile_config
        - safepath_firebase_config
      vars:
        # Numeric Apple ID of the app record in App Store Connect (this is
        # NOT the bundle identifier). Only exists once the app record has
        # been created in App Store Connect -- see docs/EXTERNAL-SETUP.md,
        # "App Store Connect API key". Replace this placeholder, or move it
        # into a secure group instead of a plain var.
        APP_STORE_APPLE_ID: "REPLACE_WITH_APP_STORE_CONNECT_APPLE_ID"

    integrations:
      # Name of the App Store Connect API key integration as registered in
      # the Codemagic UI (Team settings / personal account -> Integrations
      # -> App Store Connect). This is a reference to a key stored in
      # Codemagic, never key material. Documented verbatim in
      # docs/EXTERNAL-SETUP.md, "Codemagic setup".
      app_store_connect: safepath_asc_api_key

    scripts:
      - name: Materialize gitignored configuration from secure variables
        script: |
          # mobile/env.json and mobile/ios/Runner/GoogleService-Info.plist
          # are both gitignored and must exist on the runner before any
          # build step. If either is silently missing, the build still
          # succeeds and produces an app that installs fine and then never
          # receives a push -- exactly the failure this whole pipeline
          # exists to catch, so fail loudly and by name instead.
          if [ -z "$MOBILE_ENV_JSON" ]; then
            echo "ERROR: MOBILE_ENV_JSON is not set. See docs/EXTERNAL-SETUP.md (Codemagic setup) for how to provision it."
            exit 1
          fi
          echo "$MOBILE_ENV_JSON" > env.json

          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "ERROR: GOOGLE_SERVICE_INFO_PLIST_BASE64 is not set. See docs/EXTERNAL-SETUP.md (Codemagic setup) for how to provision it."
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          # mobile/ios/Podfile is not committed -- it is generated by the
          # Flutter tool on first iOS build, so this step both creates and
          # consumes it.
          flutter precache --ios
          cd ios && pod install

      - name: Set up code signing
        script: |
          # Applies the certificate/provisioning profile Codemagic fetched
          # via ios_signing + the app_store_connect integration above, and
          # writes the export options plist that the build step below
          # consumes.
          xcode-project use-profiles

      - name: Build and sign IPA for TestFlight
        script: |
          # TestFlight rejects a build whose number is not strictly greater
          # than every previous upload, so the build number is derived from
          # App Store Connect rather than taken from pubspec.yaml.
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1))
          flutter build ipa --release \
            --dart-define-from-file=env.json \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # beta_groups:
        #   - "Internal Testers"
      email:
        recipients:
          - REPLACE_WITH_YOUR_EMAIL@example.com
        notify:
          success: true
          failure: true

  android-apk:
    name: Android APK build (optional, secondary)
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: mobile

    # This workflow exists only so one pipeline covers both platforms after
    # a single Firebase provisioning pass. Android needs no cloud Mac and is
    # faster to verify in a local emulator -- leave this unrun unless a
    # clean-machine reproduction is actually wanted.
    # If the Codemagic account's plan restricts instance types, switching
    # instance_type to mac_mini_m2 is the fallback.
    # No `triggering` block here either, for the same reason as above.

    environment:
      flutter: stable
      java: 17
      groups:
        - safepath_mobile_config
        - safepath_firebase_config

    scripts:
      - name: Materialize gitignored configuration from secure variables
        script: |
          if [ -z "$MOBILE_ENV_JSON" ]; then
            echo "ERROR: MOBILE_ENV_JSON is not set. See docs/EXTERNAL-SETUP.md (Codemagic setup) for how to provision it."
            exit 1
          fi
          echo "$MOBILE_ENV_JSON" > env.json

          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 is not set. See docs/EXTERNAL-SETUP.md (Codemagic setup) for how to provision it."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build debug APK
        script: |
          # Deliberately --debug, not --release: the app module's release
          # build type is still signed with the debug keystore (see
          # android/app/build.gradle.kts buildTypes), so a release APK here
          # would carry no more trust than a debug one and would only mask
          # that gap.
          flutter build apk --debug \
            --dart-define-from-file=env.json \
            --dart-define=API_BASE_URL=$API_BASE_URL

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/logs/*.log
